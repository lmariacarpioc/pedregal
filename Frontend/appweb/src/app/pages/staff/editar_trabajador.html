<div class="edit-page-container" *ngIf="trabajadorEdicion">
  
  <!-- ENCABEZADO PRINCIPAL -->
  <header class="edit-page-header">
    <div class="header-left-block">
      <div class="header-text-block">
        <h1>{{ esModoCreacion ? 'Registrar Nuevo Trabajador' : 'Editar Perfil del Trabajador' }}</h1>
      </div>
    </div>
    <!-- BOTONES EN LA ESQUINA SUPERIOR DERECHA -->
    <div class="edit-page-actions">
      <button type="button" class="btn-cancel" (click)="regresarAStaff()">Cancelar</button>
      <button type="button" class="btn-save" (click)="guardarCambios()">Guardar Cambios</button>
    </div>
  </header>

  <!-- CUERPO DEL FORMULARIO -->
  <div class="edit-page-body">
    
    <!-- 1. INFORMACIÓN PERSONAL (Izquierda Superior) -->
    <section class="info-card-container">
      <div class="info-card-header">
        <h2><span class="icon-span"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640"><!--!Font Awesome Free v7.2.0 by @fontawesome - https://fontawesome.com License - https://fontawesome.com/license/free Copyright 2026 Fonticons, Inc.--><path d="M 320 312 C 386.3 312 440 258.3 440 192 C 440 125.7 386.3 72 320 72 C 253.7 72 200 125.7 200 192 C 200 258.3 253.7 312 320 312 z M 290.3 368 C 191.8 368 112 447.8 112 546.3 C 112 562.7 125.3 576 141.7 576 L 498.3 576 C 514.7 576 528 562.7 528 546.3 C 528 447.8 448.2 368 349.7 368 L 290.3 368 z"/></svg></span> Información Personal</h2>
      </div>
      
      <div class="info-card-body">
        <div class="personal-info-block">
          <!-- Bloque del Avatar -->
          <div class="avatar-wrapper">
            <div class="avatar-image-container">
              
              <button type="button" class="btn-camera-upload" title="Cambiar foto">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640">
                  <!--!Font Awesome Free v7.2.0 by @fontawesome - https://fontawesome.com License -
                   https://fontawesome.com/license/free Copyright 2026 Fonticons, Inc.-->
                   <path d="M 213.1 128.8 L 202.7 160 L 128 160 C 92.7 160 64 188.7 64 224 L 64 480 C 64 515.3 92.7 544 128 544 L 512 544 C 547.3 544 576 515.3 576 480 L 576 224 C 576 188.7 547.3 160 512 160 L 437.3 160 L 426.9 128.8 C 420.4 109.2 402.1 96 381.4 96 L 258.6 96 C 237.9 96 219.6 109.2 213.1 128.8 z M 320 256 C 373 256 416 299 416 352 C 416 405 373 448 320 448 C 267 448 224 405 224 352 C 224 299 267 256 320 256 z"/></svg>
              </button>
            </div>
            <span class="worker-id-tag"></span>
          </div>

          <!-- Inputs -->
          <div class="form-grid-2 info-fields-wrapper">
            <div class="form-field">
              <label>Nombre Completo <span style="color:red">*</span></label>
              <input type="text" [(ngModel)]="trabajadorEdicion.nombre" placeholder="Ricardo Alberto Mendoza Ruiz" [class.input-error]="formularioInvalido && !trabajadorEdicion.nombre">
            </div>
            <div class="form-field">
              <label>DNI / Identificación <span style="color:red">*</span></label>
              <input type="text" [(ngModel)]="trabajadorEdicion.dni" placeholder="45982311" [class.input-error]="formularioInvalido && !trabajadorEdicion.dni" [disabled]="!esModoCreacion">
            </div>
            <div class="form-field">
              <label>Fecha de Nacimiento <span style="color:red">*</span></label>
              <input type="date" [(ngModel)]="trabajadorEdicion.fechaNacimiento" [class.input-error]="formularioInvalido && !trabajadorEdicion.fechaNacimiento">
            </div>
            <div class="form-field">
              <label>Género <span style="color:red">*</span></label>
              <select [(ngModel)]="trabajadorEdicion.genero" [class.input-error]="formularioInvalido && !trabajadorEdicion.genero">
                <option value="Masculino">Masculino</option>
                <option value="Femenino">Femenino</option>
              </select>
            </div>
          </div>
        </div>
      </div>
    </section>

    <!-- 2. INFORMACIÓN MÉDICA (Derecha Superior) -->
    <section class="info-card-container">
      <div class="info-card-header">
        <h2><span class="icon-span"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640"><!--!Font Awesome Free v7.2.0 by @fontawesome - https://fontawesome.com License - https://fontawesome.com/license/free Copyright 2026 Fonticons, Inc.--><path d="M 264 112 L 376 112 C 380.4 112 384 115.6 384 120 L 384 160 L 256 160 L 256 120 C 256 115.6 259.6 112 264 112 z M 208 120 L 208 160 L 128 160 C 92.7 160 64 188.7 64 224 L 64 480 C 64 515.3 92.7 544 128 544 L 512 544 C 547.3 544 576 515.3 576 480 L 576 224 C 576 188.7 547.3 160 512 160 L 432 160 L 432 120 C 432 89.1 406.9 64 376 64 L 264 64 C 233.1 64 208 89.1 208 120 z M 288 280 C 288 271.2 295.2 264 304 264 L 336 264 C 344.8 264 352 271.2 352 280 L 352 320 L 392 320 C 400.8 320 408 327.2 408 336 L 408 368 C 408 376.8 400.8 384 392 384 L 352 384 L 352 424 C 352 432.8 344.8 440 336 440 L 304 440 C 295.2 440 288 432.8 288 424 L 288 384 L 248 384 C 239.2 384 232 376.8 232 368 L 232 336 C 232 327.2 239.2 320 248 320 L 288 320 L 288 280 z"/></svg></span> Información Médica</h2>
      </div>
      
      <div class="info-card-body">
        <div class="form-vertical-stack">
          <div class="form-field">
            <label>Grupo Sanguíneo</label>
            <select [(ngModel)]="trabajadorEdicion.grupoSanguineo">
              <option value="A+">A+</option>
              <option value="A-">A-</option>
              <option value="B+">B+</option>
              <option value="B-">B-</option>
              <option value="O+">O+</option>
              <option value="O-">O-</option>
            </select>
          </div>
          <div class="form-field">
            <label>Alergias Conocidas</label>
            <input type="text" [(ngModel)]="trabajadorEdicion.alergias" placeholder="Ninguna reportada">
          </div>
          <div class="form-field">
            <label>Restricciones Físicas</label>
            <input type="text" [(ngModel)]="trabajadorEdicion.restricciones" placeholder="Evitar exposición prolongada a fertilizantes nitrogenados">
          </div>
        </div>
      </div>
    </section>

    <!-- 3. INFORMACIÓN LABORAL (Ancho Completo Inferior) -->
    <section class="info-card-container full-width-card">
      <div class="info-card-header">
        <h2><span class="icon-span"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 576 512" fill="currentColor"><path d="M112 112c0-26.5-21.5-48-48-48S16 85.5 16 112v42.7L2.1 169.8c-1.4 1.5-2.1 3.5-2.1 5.5v72.1C0 263.1 12.5 276 28.5 276h17c4.6 62.7 56.6 112 120.3 112c52.2 0 96.6-33.3 113.8-80H347.5c6 30 32.7 52 64.5 52c35.3 0 64-28.7 64-64s-28.7-64-64-64c-16 0-30.6 5.9-41.9 15.6l-20.9-41.8c-1.3-2.6-3.4-4.7-6-6L304 224V144c0-26.5-21.5-48-48-48H112v16zm0 48h144v80H112v-80zm54.1 160c-26.5 0-48-21.5-48-48s21.5-48 48-48s48 21.5 48 48s-21.5 48-48 48zm245.9 0c-17.7 0-32-14.3-32-32s14.3-32 32-32s32 14.3 32 32s-14.3 32-32 32zM48 112c0-8.8 7.2-16 16-16s16 7.2 16 16v32H48v-32zm464 48h32c17.7 0 32 14.3 32 32v128c0 17.7-14.3 32-32 32h-11.4c-8.9-35.3-40.8-62-79.6-64l29.4-58.8c4.3-8.6 4.6-18.7 .9-27.5L462 166.4l45-1.5c2.7-.1 5 2 5 4.7v5.4C512 166.2 512 160 512 160z"/></svg></span> Información Laboral</h2>
      </div>
      
      <div class="info-card-body">
        <div class="form-grid-4">
          <div class="form-field">
            <label>Fundo Asignado <span style="color:red">*</span></label>
            <select [(ngModel)]="trabajadorEdicion.lote" [class.input-error]="formularioInvalido && !trabajadorEdicion.lote">
          <option value="Lote 12 - Fundo Yaurilla">Lote 12 - Fundo Yaurilla</option>
          <option value="Lote 08 - Fundo Yaurilla">Lote 08 - Fundo Yaurilla</option>
          <option value="Lote 04 - Fundo Yaurilla">Lote 04 - Fundo Yaurilla</option>
        </select>
          </div>
          <div class="form-field">
            <label>Jefe de Campo / Asignación <span style="color:red">*</span></label>
            <div class="input-with-badge-icon">
              <select [(ngModel)]="trabajadorEdicion.jefeSyncId" [class.input-error]="formularioInvalido && !trabajadorEdicion.jefeSyncId">
                <option value="">[Sin Asignar]</option>
                <option *ngFor="let jefe of jefes" [value]="jefe.id">{{ jefe.nombre }}</option>
              </select>
            </div>
          </div>
          <div class="form-field highlight-field">
            <label>Cargo / Rango <span style="color:red">*</span></label>
            <div class="input-with-badge-icon">
              <select [(ngModel)]="trabajadorEdicion.labor" class="text-red-bold" [class.input-error]="formularioInvalido && !trabajadorEdicion.labor">
            <option value="Cosecha de Uva">Cosecha de Uva</option>
            <option value="Poda de Vid">Poda </option>
            <option value="Raleo de Racimos">Raleo de Racimos</option>
           </select>
              <span class="inner-icon-badge"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640"><!--!Font Awesome Free v7.2.0 by @fontawesome - https://fontawesome.com License - https://fontawesome.com/license/free Copyright 2026 Fonticons, Inc.--><path d="M 320.3 192 L 235.7 51.1 C 229.2 40.3 215.6 36.4 204.4 42 L 117.8 85.3 C 105.9 91.2 101.1 105.6 107 117.5 L 176.6 256.6 C 146.5 290.5 128.3 335.1 128.3 384 C 128.3 490 214.3 576 320.3 576 C 426.3 576 512.3 490 512.3 384 C 512.3 335.1 494 290.5 464 256.6 L 533.6 117.5 C 539.5 105.6 534.7 91.2 522.9 85.3 L 436.2 41.9 C 425 36.3 411.3 40.3 404.9 51 L 320.3 192 z M 351.1 334.5 C 352.5 337.3 355.1 339.2 358.1 339.6 L 408.2 346.9 C 415.9 348 418.9 357.4 413.4 362.9 L 377.1 398.3 C 374.9 400.5 373.9 403.5 374.4 406.6 L 383 456.5 C 384.3 464.1 376.3 470 369.4 466.4 L 324.6 442.8 C 321.9 441.4 318.6 441.4 315.9 442.8 L 271.1 466.4 C 264.2 470 256.2 464.2 257.5 456.5 L 266.1 406.6 C 266.6 403.6 265.6 400.5 263.4 398.3 L 227.1 362.9 C 221.5 357.5 224.6 348.1 232.3 346.9 L 282.4 339.6 C 285.4 339.2 288.1 337.2 289.4 334.5 L 311.8 289.1 C 315.2 282.1 325.1 282.1 328.6 289.1 L 351 334.5 z"/></svg></span>
            </div>
          </div>
          <div class="form-field">
            <label>Fecha de Ingreso <span style="color:red">*</span></label>
            <input type="date" [(ngModel)]="trabajadorEdicion.fechaIngreso" [class.input-error]="formularioInvalido && !trabajadorEdicion.fechaIngreso">
          </div>


        </div>
      </div>
    </section>

  </div>

  <!-- 4. TARJETAS DE ESTADO INFERIORES -->
  <footer class="status-badges-container">
    <div class="badge-card card-active">
      <span class="badge-icon-circle bg-circle-green"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640"><!--!Font Awesome Free v7.2.0 by @fontawesome - https://fontawesome.com License - https://fontawesome.com/license/free Copyright 2026 Fonticons, Inc.--><path d="M 530.8 134.1 C 545.1 144.5 548.3 164.5 537.9 178.8 L 281.9 530.8 C 276.4 538.4 267.9 543.1 258.5 543.9 C 249.1 544.7 240 541.2 233.4 534.6 L 105.4 406.6 C 92.9 394.1 92.9 373.8 105.4 361.3 C 117.9 348.8 138.2 348.8 150.7 361.3 L 252.2 462.8 L 486.2 141.1 C 496.6 126.8 516.6 123.6 530.9 134 z"/></svg></span>
      <div class="badge-text-wrapper">
        <span class="badge-label">Estado Contractual</span>
        <span class="badge-value">Activo - Indefinido</span>
      </div>
    </div>
    
    <div class="badge-card card-sync">
      <span class="badge-icon-circle bg-circle-blue"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640"><!--!Font Awesome Free v7.2.0 by @fontawesome - https://fontawesome.com License - https://fontawesome.com/license/free Copyright 2026 Fonticons, Inc.--><path d="M 534.6 182.6 C 547.1 170.1 547.1 149.8 534.6 137.3 L 470.6 73.3 C 461.4 64.1 447.7 61.4 435.7 66.4 C 423.7 71.4 416 83.1 416 96 L 416 128 L 256 128 C 150 128 64 214 64 320 C 64 337.7 78.3 352 96 352 C 113.7 352 128 337.7 128 320 C 128 249.3 185.3 192 256 192 L 416 192 L 416 224 C 416 236.9 423.8 248.6 435.8 253.6 C 447.8 258.6 461.5 255.8 470.7 246.7 L 534.7 182.7 z M 105.4 457.4 C 92.9 469.9 92.9 490.2 105.4 502.7 L 169.4 566.7 C 178.6 575.9 192.3 578.6 204.3 573.6 C 216.3 568.6 224 556.9 224 544 L 224 512 L 384 512 C 490 512 576 426 576 320 C 576 302.3 561.7 288 544 288 C 526.3 288 512 302.3 512 320 C 512 390.7 454.7 448 384 448 L 224 448 L 224 416 C 224 403.1 216.2 391.4 204.2 386.4 C 192.2 381.4 178.5 384.2 169.3 393.3 L 105.3 457.3 z"/></svg></span>
      <div class="badge-text-wrapper">
        <span class="badge-label">Sincronización</span>
        <span class="badge-value">Al día (hace 5 min)</span>
      </div>
    </div>
    
    <div class="badge-card card-eval">
      <span class="badge-icon-circle bg-circle-orange"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640"><!--!Font Awesome Free v7.2.0 by @fontawesome - https://fontawesome.com License - https://fontawesome.com/license/free Copyright 2026 Fonticons, Inc.--><path d="M 568.4 196.5 C 563.9 207 550 206.3 543.5 196.9 C 515.7 156.9 477.4 124.7 432.5 104.3 C 422.1 99.6 418.8 86 428.4 79.7 C 443.4 69.8 461.4 64 480.7 64 C 533.3 64 575.9 106.6 575.9 159.2 C 575.9 172.4 573.2 185 568.3 196.5 z M 96.5 196.9 C 90 206.3 76 207 71.6 196.5 C 66.7 185 64 172.4 64 159.2 C 64 106.6 106.6 64 159.2 64 C 178.5 64 196.5 69.8 211.5 79.7 C 221.1 86 217.8 99.6 207.4 104.3 C 162.6 124.7 124.3 156.9 96.4 196.9 z M 454.2 531.4 C 416.8 559.4 370.3 576 320 576 C 269.7 576 223.2 559.4 185.9 531.4 L 150.6 566.6 C 138.1 579.1 117.8 579.1 105.3 566.6 C 92.8 554.1 92.8 533.8 105.3 521.3 L 140.5 486.1 C 112.6 448.8 96 402.3 96 352 C 96 228.3 196.3 128 320 128 C 443.7 128 544 228.3 544 352 C 544 402.3 527.4 448.8 499.4 486.2 L 534.6 521.4 C 547.1 533.9 547.1 554.2 534.6 566.7 C 522.1 579.2 501.8 579.2 489.3 566.7 L 454.1 531.5 z M 344 248 C 344 234.7 333.3 224 320 224 C 306.7 224 296 234.7 296 248 L 296 352 C 296 358.4 298.5 364.5 303 369 L 359 425 C 368.4 434.4 383.6 434.4 392.9 425 C 402.2 415.6 402.3 400.4 392.9 391.1 L 343.9 342.1 L 343.9 248 z"/></svg></span>
      <div class="badge-text-wrapper">
        <span class="badge-label">Última Evaluación</span>
        <span class="badge-value">{{ ultimaEvaluacion }}</span>
      </div>
    </div>
  </footer>

</div>
