<div class="edit-page-container" *ngIf="trabajadorEdicion">
  
  <!-- ENCABEZADO PRINCIPAL -->
  <header class="edit-page-header">
    <div class="header-left-block">
      <div class="header-text-block">
        <h1>Editar Perfil del Trabajador</h1>
      </div>
    </div>
    <!-- BOTONES EN LA ESQUINA SUPERIOR DERECHA -->
    <div class="edit-page-actions">
      <button type="button" class="btn-cancel" (click)="regresarAStaff()">Cancelar</button>
      <button type="button" class="btn-save" (click)="guardarCambios()">Guardar Cambios</button>
    </div>
  </header>

  <!-- CUERPO DEL FORMULARIO -->
  <div class="edit-page-body">
    
    <!-- 1. INFORMACIÓN PERSONAL (Izquierda Superior) -->
    <section class="info-card-container">
      <div class="info-card-header">
        <h2><span class="icon-span"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640"><!--!Font Awesome Free v7.2.0 by @fontawesome - https://fontawesome.com License - https://fontawesome.com/license/free Copyright 2026 Fonticons, Inc.--><path d="M320 312C386.3 312 440 258.3 440 192C440 125.7 386.3 72 320 72C253.7 72 200 125.7 200 192C200 258.3 253.7 312 320 312zM290.3 368C191.8 368 112 447.8 112 546.3C112 562.7 125.3 576 141.7 576L498.3 576C514.7 576 528 562.7 528 546.3C528 447.8 448.2 368 349.7 368L290.3 368z"/></svg></span> Información Personal</h2>
      </div>
      
      <div class="info-card-body">
        <div class="personal-info-block">
          <!-- Bloque del Avatar -->
          <div class="avatar-wrapper">
            <div class="avatar-image-container">
              
              <button type="button" class="btn-camera-upload" title="Cambiar foto">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640">
                  <!--!Font Awesome Free v7.2.0 by @fontawesome - https://fontawesome.com License -
                   https://fontawesome.com/license/free Copyright 2026 Fonticons, Inc.-->
                   <path d="M213.1 128.8L202.7 160L128 160C92.7 160 64 188.7 64 224L64 480C64 
                   515.3 92.7 544 128 544L512 544C547.3 544 576 515.3 576 480L576 224C576 188.7 
                   547.3 160 512 160L437.3 160L426.9 128.8C420.4 109.2 402.1 96 381.4 96L258.6 
                   96C237.9 96 219.6 109.2 213.1 128.8zM320 256C373 256 416 299 416 352C416 405 373 448
                    320 448C267 448 224 405 224 352C224 299 267 256 320 256z"/></svg>
              </button>
            </div>
            <span class="worker-id-tag"></span>
          </div>

          <!-- Inputs -->
          <div class="form-grid-2 info-fields-wrapper">
            <div class="form-field">
              <label>Nombre Completo</label>
              <input type="text" [(ngModel)]="trabajadorEdicion.nombre" placeholder="Ricardo Alberto Mendoza Ruiz">
            </div>
            <div class="form-field">
              <label>DNI / Identificación</label>
              <input type="text" [(ngModel)]="trabajadorEdicion.dni" placeholder="45982311">
            </div>
            <div class="form-field">
              <label>Fecha de Nacimiento</label>
              <input type="text" [(ngModel)]="trabajadorEdicion.fechaNacimiento" placeholder="05/14/1888">
            </div>
            <div class="form-field">
              <label>Género</label>
              <select [(ngModel)]="trabajadorEdicion.genero">
                <option value="Masculino">Masculino</option>
                <option value="Femenino">Femenino</option>
              </select>
            </div>
          </div>
        </div>
      </div>
    </section>

    <!-- 2. INFORMACIÓN MÉDICA (Derecha Superior) -->
    <section class="info-card-container">
      <div class="info-card-header">
        <h2><span class="icon-span"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640"><!--!Font Awesome Free v7.2.0 by @fontawesome - https://fontawesome.com License - https://fontawesome.com/license/free Copyright 2026 Fonticons, Inc.--><path d="M264 112L376 112C380.4 112 384 115.6 384 120L384 160L256 160L256 120C256 115.6 259.6 112 264 112zM208 120L208 160L128 160C92.7 160 64 188.7 64 224L64 480C64 515.3 92.7 544 128 544L512 544C547.3 544 576 515.3 576 480L576 224C576 188.7 547.3 160 512 160L432 160L432 120C432 89.1 406.9 64 376 64L264 64C233.1 64 208 89.1 208 120zM288 280C288 271.2 295.2 264 304 264L336 264C344.8 264 352 271.2 352 280L352 320L392 320C400.8 320 408 327.2 408 336L408 368C408 376.8 400.8 384 392 384L352 384L352 424C352 432.8 344.8 440 336 440L304 440C295.2 440 288 432.8 288 424L288 384L248 384C239.2 384 232 376.8 232 368L232 336C232 327.2 239.2 320 248 320L288 320L288 280z"/></svg></span> Información Médica</h2>
      </div>
      
      <div class="info-card-body">
        <div class="form-vertical-stack">
          <div class="form-field">
            <label>Grupo Sanguíneo</label>
            <select [(ngModel)]="trabajadorEdicion.grupoSanguineo">
              <option value="A+">A+</option>
              <option value="A-">A-</option>
              <option value="B+">B+</option>
              <option value="B-">B-</option>
              <option value="O+">O+</option>
              <option value="O-">O-</option>
            </select>
          </div>
          <div class="form-field">
            <label>Alergias Conocidas</label>
            <input type="text" [(ngModel)]="trabajadorEdicion.alergias" placeholder="Ninguna reportada">
          </div>
          <div class="form-field">
            <label>Restricciones Físicas</label>
            <input type="text" [(ngModel)]="trabajadorEdicion.restricciones" placeholder="Evitar exposición prolongada a fertilizantes nitrogenados">
          </div>
        </div>
      </div>
    </section>

    <!-- 3. INFORMACIÓN LABORAL (Ancho Completo Inferior) -->
    <section class="info-card-container full-width-card">
      <div class="info-card-header">
        <h2><span class="icon-span"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640"><!--!Font Awesome Free v7.2.0 by @fontawesome - https://fontawesome.com License - https://fontawesome.com/license/free Copyright 2026 Fonticons, Inc.--><path d="M192 160L192 256L325.4 256L267.8 160L192 160zM128 287L128 128C128 110.3 142.3 96 160 96L267.8 96C290.3 96 311.1 107.8 322.7 127.1L400.1 256L464.1 256L464.1 184C464.1 170.7 474.8 160 488.1 160C501.4 160 512.1 170.7 512.1 184L512.1 256L560.1 256C586.6 256 608.1 277.5 608.1 304L608.1 345.5C608.1 359.7 601.8 373.3 590.8 382.4L555.8 411.6C582.3 426.8 600.1 455.3 600.1 488C600.1 536.6 560.7 576 512.1 576C463.5 576 424.1 536.6 424.1 488C424.1 473.6 427.6 460 433.7 448L332.5 448C329.5 461.4 324.6 474 318.1 485.7C325.8 495.1 325.3 509.1 316.5 517.9L293.9 540.5C285.1 549.3 271.2 549.8 261.7 542.1C252.4 547.3 242.4 551.4 231.9 554.4C230.7 566.5 220.5 576 208 576L176 576C163.6 576 153.3 566.5 152.1 554.4C141.6 551.4 131.7 547.2 122.3 542.1C112.9 549.8 98.9 549.3 90.1 540.5L67.5 517.8C58.7 509 58.2 495.1 65.9 485.6C60.7 476.3 56.6 466.3 53.6 455.8C41.5 454.6 32 444.4 32 431.9L32 399.9C32 387.5 41.5 377.2 53.6 376C56.6 365.5 60.8 355.6 65.9 346.2C58.2 336.8 58.7 322.8 67.5 314L90.1 291.4C98.9 282.6 112.8 282.1 122.3 289.8C124.2 288.8 126 287.8 128 286.8zM192 352C156.7 352 128 380.7 128 416C128 451.3 156.7 480 192 480C227.3 480 256 451.3 256 416C256 380.7 227.3 352 192 352zM472 488C472 510.1 489.9 528 512 528C534.1 528 552 510.1 552 488C552 465.9 534.1 448 512 448C489.9 448 472 465.9 472 488z"/></svg></span> Información Laboral</h2>
      </div>
      
      <div class="info-card-body">
        <div class="form-grid-4">
          <div class="form-field">
            <label>Fundo Asignado</label>
            <select [(ngModel)]="trabajadorEdicion.lote">
          <option value="Lote 12 - Fundo Yaurilla">Lote 12 - Fundo Yaurilla</option>
          <option value="Lote 08 - Fundo Yaurilla">Lote 08 - Fundo Yaurilla</option>
          <option value="Lote 04 - Fundo Yaurilla">Lote 04 - Fundo Yaurilla</option>
        </select>
          </div>
          <div class="form-field">
            <label>Lote / Cuadrilla</label>
            <input type="text" [(ngModel)]="trabajadorEdicion.lote" placeholder="Lote 42-B">
          </div>
          <div class="form-field highlight-field">
            <label>Cargo / Rango</label>
            <div class="input-with-badge-icon">
              <select [(ngModel)]="trabajadorEdicion.labor" class="text-red-bold">
            <option value="Cosecha de Uva">Cosecha de Uva</option>
            <option value="Poda de Vid">Poda </option>
            <option value="Raleo de Racimos">Raleo de Racimos</option>
           </select>
              <span class="inner-icon-badge"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640"><!--!Font Awesome Free v7.2.0 by @fontawesome - https://fontawesome.com License - https://fontawesome.com/license/free Copyright 2026 Fonticons, Inc.--><path d="M320.3 192L235.7 51.1C229.2 40.3 215.6 36.4 204.4 42L117.8 85.3C105.9 91.2 101.1 105.6 107 117.5L176.6 256.6C146.5 290.5 128.3 335.1 128.3 384C128.3 490 214.3 576 320.3 576C426.3 576 512.3 490 512.3 384C512.3 335.1 494 290.5 464 256.6L533.6 117.5C539.5 105.6 534.7 91.2 522.9 85.3L436.2 41.9C425 36.3 411.3 40.3 404.9 51L320.3 192zM351.1 334.5C352.5 337.3 355.1 339.2 358.1 339.6L408.2 346.9C415.9 348 418.9 357.4 413.4 362.9L377.1 398.3C374.9 400.5 373.9 403.5 374.4 406.6L383 456.5C384.3 464.1 376.3 470 369.4 466.4L324.6 442.8C321.9 441.4 318.6 441.4 315.9 442.8L271.1 466.4C264.2 470 256.2 464.2 257.5 456.5L266.1 406.6C266.6 403.6 265.6 400.5 263.4 398.3L227.1 362.9C221.5 357.5 224.6 348.1 232.3 346.9L282.4 339.6C285.4 339.2 288.1 337.2 289.4 334.5L311.8 289.1C315.2 282.1 325.1 282.1 328.6 289.1L351 334.5z"/></svg></span>
            </div>
          </div>
          <div class="form-field">
            <label>Horas Laboradas</label>
        <input type="number" [(ngModel)]="trabajadorEdicion.horasLaboradas">
          </div>


        </div>
      </div>
    </section>

  </div>

  <!-- 4. TARJETAS DE ESTADO INFERIORES -->
  <footer class="status-badges-container">
    <div class="badge-card card-active">
      <span class="badge-icon-circle bg-circle-green"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640"><!--!Font Awesome Free v7.2.0 by @fontawesome - https://fontawesome.com License - https://fontawesome.com/license/free Copyright 2026 Fonticons, Inc.--><path d="M530.8 134.1C545.1 144.5 548.3 164.5 537.9 178.8L281.9 530.8C276.4 538.4 267.9 543.1 258.5 543.9C249.1 544.7 240 541.2 233.4 534.6L105.4 406.6C92.9 394.1 92.9 373.8 105.4 361.3C117.9 348.8 138.2 348.8 150.7 361.3L252.2 462.8L486.2 141.1C496.6 126.8 516.6 123.6 530.9 134z"/></svg></span>
      <div class="badge-text-wrapper">
        <span class="badge-label">Estado Contractual</span>
        <span class="badge-value">Activo - Indefinido</span>
      </div>
    </div>
    
    <div class="badge-card card-sync">
      <span class="badge-icon-circle bg-circle-blue"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640"><!--!Font Awesome Free v7.2.0 by @fontawesome - https://fontawesome.com License - https://fontawesome.com/license/free Copyright 2026 Fonticons, Inc.--><path d="M534.6 182.6C547.1 170.1 547.1 149.8 534.6 137.3L470.6 73.3C461.4 64.1 447.7 61.4 435.7 66.4C423.7 71.4 416 83.1 416 96L416 128L256 128C150 128 64 214 64 320C64 337.7 78.3 352 96 352C113.7 352 128 337.7 128 320C128 249.3 185.3 192 256 192L416 192L416 224C416 236.9 423.8 248.6 435.8 253.6C447.8 258.6 461.5 255.8 470.7 246.7L534.7 182.7zM105.4 457.4C92.9 469.9 92.9 490.2 105.4 502.7L169.4 566.7C178.6 575.9 192.3 578.6 204.3 573.6C216.3 568.6 224 556.9 224 544L224 512L384 512C490 512 576 426 576 320C576 302.3 561.7 288 544 288C526.3 288 512 302.3 512 320C512 390.7 454.7 448 384 448L224 448L224 416C224 403.1 216.2 391.4 204.2 386.4C192.2 381.4 178.5 384.2 169.3 393.3L105.3 457.3z"/></svg></span>
      <div class="badge-text-wrapper">
        <span class="badge-label">Sincronización</span>
        <span class="badge-value">Al día (hace 5 min)</span>
      </div>
    </div>
    
    <div class="badge-card card-eval">
      <span class="badge-icon-circle bg-circle-orange"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640"><!--!Font Awesome Free v7.2.0 by @fontawesome - https://fontawesome.com License - https://fontawesome.com/license/free Copyright 2026 Fonticons, Inc.--><path d="M568.4 196.5C563.9 207 550 206.3 543.5 196.9C515.7 156.9 477.4 124.7 432.5 104.3C422.1 99.6 418.8 86 428.4 79.7C443.4 69.8 461.4 64 480.7 64C533.3 64 575.9 106.6 575.9 159.2C575.9 172.4 573.2 185 568.3 196.5zM96.5 196.9C90 206.3 76 207 71.6 196.5C66.7 185 64 172.4 64 159.2C64 106.6 106.6 64 159.2 64C178.5 64 196.5 69.8 211.5 79.7C221.1 86 217.8 99.6 207.4 104.3C162.6 124.7 124.3 156.9 96.4 196.9zM454.2 531.4C416.8 559.4 370.3 576 320 576C269.7 576 223.2 559.4 185.9 531.4L150.6 566.6C138.1 579.1 117.8 579.1 105.3 566.6C92.8 554.1 92.8 533.8 105.3 521.3L140.5 486.1C112.6 448.8 96 402.3 96 352C96 228.3 196.3 128 320 128C443.7 128 544 228.3 544 352C544 402.3 527.4 448.8 499.4 486.2L534.6 521.4C547.1 533.9 547.1 554.2 534.6 566.7C522.1 579.2 501.8 579.2 489.3 566.7L454.1 531.5zM344 248C344 234.7 333.3 224 320 224C306.7 224 296 234.7 296 248L296 352C296 358.4 298.5 364.5 303 369L359 425C368.4 434.4 383.6 434.4 392.9 425C402.2 415.6 402.3 400.4 392.9 391.1L343.9 342.1L343.9 248z"/></svg></span>
      <div class="badge-text-wrapper">
        <span class="badge-label">Última Evaluación</span>
        <span class="badge-value">12/Feb/2024</span>
      </div>
    </div>
  </footer>

</div>
