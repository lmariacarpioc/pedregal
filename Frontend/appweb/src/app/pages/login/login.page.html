<div class="login-wrapper">

    <div class="login-left-panel">
    <div class="visual-content">
      <span class="agro-badge">Plataforma Agroindustrial</span>
      <h2>Precisión digital en el corazón del campo</h2>
      <p>Gestione sus aportes agrícolas, controle el personal de staff y monitoree el rendimiento operativo de Pedregal en tiempo real.</p>
    </div>
    </div>


  <div class="login-right-panel">
    <div class="login-card">
      <div class="login-header">
            <svg class="header-icon-svg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 512"><path d="M528 336c-48.6 0-88 39.4-88 88s39.4 88 88 88 88-39.4 88-88-39.4-88-88-88zm0 112c-13.23 0-24-10.77-24-24s10.77-24 24-24 24 10.77 24 24-10.77 24-24 24zm80-288h-64v-40.2c0-14.12 4.7-27.76 13.15-38.84 4.42-5.8 3.55-14.06-1.32-19.49L534.2 37.3c-6.66-7.45-18.32-6.92-24.7.78C490.58 60.9 480 89.81 480 119.8V160H377.67L321.58 29.14A47.914 47.914 0 0 0 277.45 0H144c-26.47 0-48 21.53-48 48v146.52c-8.63-6.73-20.96-6.46-28.89 1.47L36 227.1c-8.59 8.59-8.59 22.52 0 31.11l5.06 5.06c-4.99 9.26-8.96 18.82-11.91 28.72H22c-12.15 0-22 9.85-22 22v44c0 12.15 9.85 22 22 22h7.14c2.96 9.91 6.92 19.46 11.91 28.73l-5.06 5.06c-8.59 8.59-8.59 22.52 0 31.11L67.1 476c8.59 8.59 22.52 8.59 31.11 0l5.06-5.06c9.26 4.99 18.82 8.96 28.72 11.91V490c0 12.15 9.85 22 22 22h44c12.15 0 22-9.85 22-22v-7.14c9.9-2.95 19.46-6.92 28.72-11.91l5.06 5.06c8.59 8.59 22.52 8.59 31.11 0l31.11-31.11c8.59-8.59 8.59-22.52 0-31.11l-5.06-5.06c4.99-9.26 8.96-18.82 11.91-28.72H330c12.15 0 22-9.85 22-22v-6h80.54c21.91-28.99 56.32-48 95.46-48 18.64 0 36.07 4.61 51.8 12.2l50.82-50.82c6-6 9.37-14.14 9.37-22.63V192c.01-17.67-14.32-32-31.99-32zM176 416c-44.18 0-80-35.82-80-80s35.82-80 80-80 80 35.82 80 80-35.82 80-80 80zm22-256h-38V64h106.89l41.15 96H198z"/></svg>
        <h2>EL PEDREGAL</h2>
        <p>SUPERVISIÓN AGRÍCOLA</p>
      </div>

      <form class="login-form" (ngSubmit)="login()">
        <div class="form-group">
          <label for="username">Usuario</label>
          <div class="input-wrapper">
            <svg class="user-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640"><path d="M 240 192 C 240 147.8 275.8 112 320 112 C 364.2 112 400 147.8 400 192 C 400 236.2 364.2 272 320 272 C 275.8 272 240 236.2 240 192 z M 448 192 C 448 121.3 390.7 64 320 64 C 249.3 64 192 121.3 192 192 C 192 262.7 249.3 320 320 320 C 390.7 320 448 262.7 448 192 z M 144 544 C 144 473.3 201.3 416 272 416 L 368 416 C 438.7 416 496 473.3 496 544 L 496 552 C 496 565.3 506.7 576 520 576 C 533.3 576 544 565.3 544 552 L 544 544 C 544 446.8 465.2 368 368 368 L 272 368 C 174.8 368 96 446.8 96 544 L 96 552 C 96 565.3 106.7 576 120 576 C 133.3 576 144 565.3 144 552 L 144 544 z"/></svg>
            <input type="text" id="u s e r n a m e" name="username" [(ngModel)]="username" placeholder="Ingrese su nombre de usuario" required>
          </div>
        </div>

        <div class="form-group">
          <label for="password">Contraseña</label>
          <div class="input-wrapper">
            <svg  class="contr-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640"><path d="M 256 160 L 256 224 L 384 224 L 384 160 C 384 124.7 355.3 96 320 96 C 284.7 96 256 124.7 256 160 z M 192 224 L 192 160 C 192 89.3 249.3 32 320 32 C 390.7 32 448 89.3 448 160 L 448 224 C 483.3 224 512 252.7 512 288 L 512 512 C 512 547.3 483.3 576 448 576 L 192 576 C 156.7 576 128 547.3 128 512 L 128 288 C 128 252.7 156.7 224 192 224 z"/></svg>
            <input type="password" id="p a s s w o r d" name="password" [(ngModel)]="password" placeholder="••••••••" required>
          </div>
        </div>

        <div class="form-options">
          <label class="remember-me">
            <input type="checkbox"> Recordar sesión
          </label>
          <a href="#" class="forgot-link">¿Olvidaste tu contraseña?</a>
        </div>

        <div *ngIf="errorMessage" class="error-message" style="color: red; margin-bottom: 10px; font-size: 0.9em;">
          {{ errorMessage }}
        </div>

        <button type="submit" class="btn-submit" [disabled]="isLoading">
          <span *ngIf="!isLoading">Ingresar</span>
          <span *ngIf="isLoading">Cargando...</span>
          <svg *ngIf="!isLoading" class="btn-icon-svg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640"><path d="M 409 337 C 418.4 327.6 418.4 312.4 409 303.1 L 265 159 C 258.1 152.1 247.8 150.1 238.8 153.8 C 229.8 157.5 224 166.3 224 176 L 224 256 L 112 256 C 85.5 256 64 277.5 64 304 L 64 336 C 64 362.5 85.5 384 112 384 L 224 384 L 224 464 C 224 473.7 229.8 482.5 238.8 486.2 C 247.8 489.9 258.1 487.9 265 481 L 409 337 z M 416 480 C 398.3 480 384 494.3 384 512 C 384 529.7 398.3 544 416 544 L 480 544 C 533 544 576 501 576 448 L 576 192 C 576 139 533 96 480 96 L 416 96 C 398.3 96 384 110.3 384 128 C 384 145.7 398.3 160 416 160 L 480 160 C 497.7 160 512 174.3 512 192 L 512 448 C 512 465.7 497.7 480 480 480 L 416 480 z"/></svg>
        </button>
      </form>
    </div>
  </div>

</div>
