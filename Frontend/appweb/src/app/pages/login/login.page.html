<div class="login-wrapper">

    <div class="login-left-panel">
    <div class="visual-content">
      <span class="agro-badge">Plataforma Agroindustrial</span>
      <h2>Precisión digital en el corazón del campo</h2>
      <p>Gestione sus aportes agrícolas, controle el personal de staff y monitoree el rendimiento operativo de Pedregal en tiempo real.</p>
    </div>
    </div>


  <div class="login-right-panel">
    <div class="login-card">
      <div class="login-header">
        <svg class="header-icon-svg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640"><path d="M192 160L192 256L325.4 256L267.8 160L192 160zM128 287L128 128C128 110.3 142.3 96 160 96L267.8 96C290.3 96 311.1 107.8 322.7 127.1L400.1 256L464.1 256L464.1 184C464.1 170.7 474.8 160 488.1 160C501.4 160 512.1 170.7 512.1 184L512.1 256L560.1 256C586.6 256 608.1 277.5 608.1 304L608.1 345.5C608.1 359.7 601.8 373.3 590.8 382.4L555.8 411.6C582.3 426.8 600.1 455.3 600.1 488C600.1 536.6 560.7 576 512.1 576C463.5 576 424.1 536.6 424.1 488C424.1 473.6 427.6 460 433.7 448L332.5 448C329.5 461.4 324.6 474 318.1 485.7C325.8 495.1 325.3 509.1 316.5 517.9L293.9 540.5C285.1 549.3 271.2 549.8 261.7 542.1C252.4 547.3 242.4 551.4 231.9 554.4C230.7 566.5 220.5 576 208 576L176 576C163.6 576 153.3 566.5 152.1 554.4C141.6 551.4 131.7 547.2 122.3 542.1C112.9 549.8 98.9 549.3 90.1 540.5L67.5 517.8C58.7 509 58.2 495.1 65.9 485.6C60.7 476.3 56.6 466.3 53.6 455.8C41.5 454.6 32 444.4 32 431.9L32 399.9C32 387.5 41.5 377.2 53.6 376C56.6 365.5 60.8 355.6 65.9 346.2C58.2 336.8 58.7 322.8 67.5 314L90.1 291.4C98.9 282.6 112.8 282.1 122.3 289.8C124.2 288.8 126 287.8 128 286.8zM192 352C156.7 352 128 380.7 128 416C128 451.3 156.7 480 192 480C227.3 480 256 451.3 256 416C256 380.7 227.3 352 192 352zM472 488C472 510.1 489.9 528 512 528C534.1 528 552 510.1 552 488C552 465.9 534.1 448 512 448C489.9 448 472 465.9 472 488z"/></svg>
        <h2>EL PEDREGAL</h2>
        <p>SUPERVISIÓN AGRÍCOLA</p>
      </div>

      <form class="login-form" (ngSubmit)="login()">
        <div class="form-group">
          <label for="username">Usuario</label>
          <div class="input-wrapper">
            <svg class="user-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640"><path d="M240 192C240 147.8 275.8 112 320 112C364.2 112 400 147.8 400 192C400 236.2 364.2 272 320 272C275.8 272 240 236.2 240 192zM448 192C448 121.3 390.7 64 320 64C249.3 64 192 121.3 192 192C192 262.7 249.3 320 320 320C390.7 320 448 262.7 448 192zM144 544C144 473.3 201.3 416 272 416L368 416C438.7 416 496 473.3 496 544L496 552C496 565.3 506.7 576 520 576C533.3 576 544 565.3 544 552L544 544C544 446.8 465.2 368 368 368L272 368C174.8 368 96 446.8 96 544L96 552C96 565.3 106.7 576 120 576C133.3 576 144 565.3 144 552L144 544z"/></svg>
            <input type="text" id="username" name="username" [(ngModel)]="username" placeholder="Ingrese su nombre de usuario" required>
          </div>
        </div>

        <div class="form-group">
          <label for="password">Contraseña</label>
          <div class="input-wrapper">
            <svg  class="contr-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640"><path d="M256 160L256 224L384 224L384 160C384 124.7 355.3 96 320 96C284.7 96 256 124.7 256 160zM192 224L192 160C192 89.3 249.3 32 320 32C390.7 32 448 89.3 448 160L448 224C483.3 224 512 252.7 512 288L512 512C512 547.3 483.3 576 448 576L192 576C156.7 576 128 547.3 128 512L128 288C128 252.7 156.7 224 192 224z"/></svg>
            <input type="password" id="password" name="password" [(ngModel)]="password" placeholder="••••••••" required>
          </div>
        </div>

        <div class="form-options">
          <label class="remember-me">
            <input type="checkbox"> Recordar sesión
          </label>
          <a href="#" class="forgot-link">¿Olvidaste tu contraseña?</a>
        </div>

        <div *ngIf="errorMessage" class="error-message" style="color: red; margin-bottom: 10px; font-size: 0.9em;">
          {{ errorMessage }}
        </div>

        <button type="submit" class="btn-submit" [disabled]="isLoading">
          <span *ngIf="!isLoading">Ingresar</span>
          <span *ngIf="isLoading">Cargando...</span>
          <svg *ngIf="!isLoading" class="btn-icon-svg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640"><path d="M409 337C418.4 327.6 418.4 312.4 409 303.1L265 159C258.1 152.1 247.8 150.1 238.8 153.8C229.8 157.5 224 166.3 224 176L224 256L112 256C85.5 256 64 277.5 64 304L64 336C64 362.5 85.5 384 112 384L224 384L224 464C224 473.7 229.8 482.5 238.8 486.2C247.8 489.9 258.1 487.9 265 481L409 337zM416 480C398.3 480 384 494.3 384 512C384 529.7 398.3 544 416 544L480 544C533 544 576 501 576 448L576 192C576 139 533 96 480 96L416 96C398.3 96 384 110.3 384 128C384 145.7 398.3 160 416 160L480 160C497.7 160 512 174.3 512 192L512 448C512 465.7 497.7 480 480 480L416 480z"/></svg>
        </button>
      </form>
    </div>
  </div>

</div>
