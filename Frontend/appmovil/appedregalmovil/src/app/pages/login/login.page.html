<ion-content class="login-content">
  <div class="header-bg">
    <div class="logo-container">
      <i class="fas fa-tractor logo-icon"></i>
      <h1 class="logo-title">PEDREGAL</h1>
      <p class="logo-subtitle">AGRICULTURAL SYSTEMS</p>
    </div>
  </div>

  <div class="login-card">
    <h2 class="card-title">Iniciar Sesión</h2>
    <p class="card-subtitle">Ingrese sus credenciales de<br>supervisor</p>

    <form>
      <div class="input-group">
        <label>Usuario</label>
        <div class="input-wrapper">
          <i class="far fa-user input-icon"></i>
          <ion-input type="text" placeholder="ej. jsmith_pedregal"></ion-input>
        </div>
      </div>

      <div class="input-group">
        <label>Contraseña</label>
        <div class="input-wrapper">
          <i class="fas fa-lock input-icon"></i>
          <ion-input type="password" placeholder="••••••••"></ion-input>
          <i class="far fa-eye show-pwd-icon"></i>
        </div>
      </div>

      <div class="options-row">
        <ion-checkbox mode="md" class="custom-checkbox" labelPlacement="end">
          Recordarme
        </ion-checkbox>
        <a href="#" class="forgot-link">¿Olvido su<br>contraseña?</a>
      </div>

      <ion-button expand="block" type="submit" class="btn-submit">
        Ingresar <ion-icon name="arrow-forward-outline" slot="end"></ion-icon>
      </ion-button>
    </form>

    <div class="card-footer">
      <a href="#" class="footer-link"><i class="far fa-question-circle"></i> Ayuda</a>
      <div class="divider"></div>
      <a href="#" class="footer-link"><i class="fas fa-sync-alt"></i> Sincronizar</a>
    </div>
  </div>

  <div class="support-footer">
    <p>¿Problemas para ingresar? <a href="#">Contacte a soporte<br>IT</a></p>
  </div>
</ion-content>
