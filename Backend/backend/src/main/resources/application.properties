spring.application.name=backend

# ── Base de Datos (Supabase / PostgreSQL) ──
spring.datasource.url=jdbc:postgresql://aws-1-us-east-1.pooler.supabase.com:5432/postgres?sslmode=require
spring.datasource.username=postgres.vqgenbaxjlathvzodwey
spring.datasource.password=${DB_PASSWORD:Tupapideimons20.}
spring.datasource.driver-class-name=org.postgresql.Driver

# ── JPA / Hibernate ──
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ── Configuración del servidor ──
server.port=8080

# ── Tamaño máximo del JSON (para sincronización masiva) ──
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB
server.tomcat.max-http-form-post-size=50MB

# ── Jackson (serialización JSON) ──
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.time-zone=America/Lima

# ── Logging ──
logging.level.com.pedregal.backend=DEBUG
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=DEBUG